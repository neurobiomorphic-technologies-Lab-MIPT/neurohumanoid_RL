[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-so101-aawr"
version = "0.1.0"
description = "Gymnasium SO-101 lift environment for AAWR experiments"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.1,<2",
  "mujoco>=3.3,<4",
  "numpy>=1.26,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
